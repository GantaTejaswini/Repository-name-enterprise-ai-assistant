# A generic, single database configuration.

[alembic]

# Path to migration scripts.
script_location = %(here)s/migrations

# Sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file.
# Leave blank for local time.
# timezone =

# Max length of characters to apply to the slug field.
truncate_slug_length = 40

# Version location specification.
# Alembic will use migrations/versions.
# version_locations =

# Path separator for lists of paths.
path_separator = os

# Search source files recursively in version locations.
# recursive_version_locations = false

# Output encoding used when generating migration files.
output_encoding = utf-8

# Database URL is intentionally empty.
# migrations/env.py loads the real PostgreSQL URL
# from the application's .env configuration.
sqlalchemy.url =


[post_write_hooks]

# No automatic formatting hooks for now.


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S